name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/laravel/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/laravel/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          # pcov habilitado - ver issue #30 (relatório de cobertura no CI).
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/laravel/vendor
          key: composer-${{ hashFiles('backend/laravel/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar .env de teste
        run: cp .env.example .env

      - name: Gerar APP_KEY
        run: php artisan key:generate

      - name: Verificar estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Rodar testes (PHPUnit, SQLite em memória, com cobertura)
        run: php artisan test --coverage

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # >=22.12 - vite 8/vitest 4 usam require(esm) internamente
          # (jsdom, rolldown); versões mais antigas do Node quebram isso.
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes unitários (Vitest, com cobertura)
        run: npm run test:coverage

      - name: Build (verifica tsc + vite build)
        run: npm run build
