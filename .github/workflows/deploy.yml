name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/laravel/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # O SSH (appleboy/ssh-action) nunca funcionou nesse host: o
      # king.host bloqueia SSH de entrada de fora da faixa de IP
      # autorizada, e a faixa de IPs do runner do GitHub Actions e
      # dinamica demais pra cadastrar (3/3 execucoes anteriores falharam
      # com "dial tcp ...: i/o timeout"). Troca pra um gatilho HTTP -
      # ver App\Http\Controllers\Api\DeployController e docs/deploy.md.
      # URL em HTTP (nao HTTPS) porque o certificado do king.host nao
      # cobre esse subdominio de 3 niveis - ver issue #71. Trocar pra
      # https:// quando isso for resolvido.
      - name: Disparar deploy via HTTP
        run: |
          curl --fail --max-time 180 -X POST \
            "http://agendatech.devpira.web88f08.kinghost.net/api/internal/deploy" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"

      - name: Notify success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'deploy/kinghost',
              description: 'Deploy pra king.host OK'
            })

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'deploy/kinghost',
              description: 'Deploy pra king.host falhou'
            })
