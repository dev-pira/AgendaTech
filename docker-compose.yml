services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendatech
      POSTGRES_PASSWORD: agendatech
      POSTGRES_DB: agendatech
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendatech -d agendatech']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agendatech:agendatech@db:5432/agendatech?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-antes-de-produção}
      JWT_EXPIRES_IN: 7d
      PORT: 3333
      NODE_ENV: development
    ports:
      - '3333:3333'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    # Aplica migrations já commitadas (prisma/migrations), popula o seed
    # (idempotente via upsert) e sobe a API com --watch.
    command: sh -c "npx prisma migrate deploy && npx prisma generate && node prisma/seed.js && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Alvo do proxy /api do Vite dentro da rede do Compose (ver frontend/vite.config.ts).
      VITE_API_PROXY_TARGET: http://backend:3333
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
